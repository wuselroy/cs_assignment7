#cloud-config
package_update: true
packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    defer: true 
    permissions: '0644'
    content: |
      <html>
        <head><title>Assignment 7</title></head>
        <body>
          <h1>Hello from ${student_name}!</h1>
          <p>${page_message}</p>
        </body>
      </html>

runcmd:
  - systemctl enable apache2
  - systemctl start apache2